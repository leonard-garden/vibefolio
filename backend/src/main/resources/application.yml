spring:
  application:
    name: vibefolio-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibefolio}
    username: ${DB_USERNAME:vibefolio}
    password: ${DB_PASSWORD:vibefolio}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.vibefolio: DEBUG
    org.springframework.security: WARN

vibefolio:
  ai:
    default-model: claude-haiku-4-5
    escalate-model: claude-sonnet-4-6
    monthly-cost-cap-usd: 50
    api-key: ${ANTHROPIC_API_KEY:change-me}
  storage:
    bucket: vibefolio-pdfs
    region: auto
    access-key-id: ${R2_ACCESS_KEY_ID:change-me}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:change-me}
    endpoint: ${R2_ENDPOINT:change-me}
  security:
    api-key: ${BE_API_KEY:dev-key-change-in-prod}
    allowed-origins:
      - https://vibefolio.com
      - http://localhost:3000
  email:
    resend-api-key: ${RESEND_API_KEY:change-me}
    from-address: noreply@vibefolio.com
  rate-limit:
    per-email-per-day: 3
    per-ip-per-day: 10
